PACKAGE_NAME="dccp"
PACKAGE_VERSION="7.0.0"
AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/modules/net/dccp ROOTDIR=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/modules CONFIG_IP_DCCP=m CONFIG_INET_DCCP_DIAG=m CONFIG_IP_DCCP_CCID2_DEBUG=n CONFIG_IP_DCCP_CCID3=m CONFIG_IP_DCCP_CCID3_DEBUG=n CONFIG_IP_DCCP_TFRC_LIB=m CONFIG_IP_DCCP_TFRC_DEBUG=n modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/modules/net/dccp clean"

BUILT_MODULE_NAME[0]="dccp"
BUILT_MODULE_LOCATION[0]="modules/net/dccp"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="dccp_ipv4"
BUILT_MODULE_LOCATION[1]="modules/net/dccp"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="dccp_ipv6"
BUILT_MODULE_LOCATION[2]="modules/net/dccp"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="dccp_diag"
BUILT_MODULE_LOCATION[3]="modules/net/dccp"
DEST_MODULE_LOCATION[3]="/updates/dkms"
