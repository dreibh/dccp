PACKAGE_NAME="dccp"
PACKAGE_VERSION="7.0.0"
AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/net/dccp CONFIG_IP_DCCP=m CONFIG_IP_DCCP_CCID3=y CONFIG_INET_DCCP_DIAG=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/net/dccp clean"

BUILT_MODULE_NAME[0]="dccp"
BUILT_MODULE_LOCATION[0]="net/dccp"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="dccp_ipv4"
BUILT_MODULE_LOCATION[1]="net/dccp"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="dccp_ipv6"
BUILT_MODULE_LOCATION[2]="net/dccp"
DEST_MODULE_LOCATION[2]="/updates/dkms"
